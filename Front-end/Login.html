<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login para quebrar senha</title>
</head>
<body>
    <h1>Página de Login</h1>
    <div class="login-box">
        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuários:</label> <br>
                <input type="text" id="username" placeholder="Digite o usuário">
            </div>
            
            <div class="input-group">
                <label for="password">Senha:</label> <br>
                <input type="password" id="password" placeholder="Tentativa de senha">
            </div>
            
            <button type="submit" id="btn-submit">Entrar</button>
        </form>

        <p id="resposta"></p>
    </div>
    

    <footer>
        <div>
            <h2>Informações</h2>
            <p>Essa página é feita apenas com intuito academico para apresentação de trabalho.<br>
            com intuito de entender a quantidade de possibilidades de senha</p>
        </div>
    </footer>
</body>
</html>
